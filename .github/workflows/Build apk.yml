name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+']
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      major:
        description: 'Major version (APK = ems-v<major>.<next>)'
        required: false
        default: '1'
      publish:
        description: 'Publish a GitHub Release with the APK'
        type: boolean
        default: true

permissions:
  contents: write # create tag + release

concurrency:
  group: ems-apk-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false # never cancel a running release: keeps version numbers unique

env:
  APP_ID: bd.gov.ems.attendance
  APP_NAME: EMS
  APK_PREFIX: ems
  DEFAULT_MAJOR: '1'
  BRAND_COLOR: '#006A4E'
  WEB_DIR: dist
  # Toolchain: bump together when upgrading Capacitor (v8 needs Node 22 + JDK 21 + SDK 36)
  NODE_VERSION: '22'
  JAVA_VERSION: '21'
  CAPACITOR_VERSION: '8'
  ANDROID_PLATFORM: '36'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------- version
      - name: Resolve version from GitHub tags
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_MAJOR: ${{ inputs.major }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          MAJOR="${INPUT_MAJOR:-$DEFAULT_MAJOR}"

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)$ ]]; then
            # A manually pushed tag decides the version
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
          else
            # Ask the GitHub API for existing v<MAJOR>.* tags and take the next number
            LAST=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v${MAJOR}." --jq '.[].ref' 2>/dev/null \
              | sed -nE "s#^refs/tags/v${MAJOR}\.([0-9]+)\$#\1#p" | sort -n | tail -1 || true)
            MINOR=$(( ${LAST:-0} + 1 ))
          fi

          VERSION_NAME="${MAJOR}.${MINOR}"
          VERSION_CODE=$(( MAJOR * 10000 + MINOR ))   # always increases with the version
          TAG="v${VERSION_NAME}"
          APK_NAME="${APK_PREFIX}-v${VERSION_NAME}.apk"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            APK_NAME="${APK_PREFIX}-v${VERSION_NAME}-pr${PR_NUMBER}.apk"
          fi

          {
            echo "VERSION_NAME=${VERSION_NAME}"
            echo "VERSION_CODE=${VERSION_CODE}"
            echo "TAG=${TAG}"
            echo "APK_NAME=${APK_NAME}"
          } | tee -a "$GITHUB_ENV" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------------- toolchain
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2 # repo ships bun.lock

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_PLATFORM }}
            build-tools;${{ env.ANDROID_PLATFORM }}.0.0

      - name: Install librsvg (icon rendering)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin

      # ----------------------------------------------------------------- web app
      - name: Install dependencies
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile || bun install
          else
            npm install --no-audit --no-fund
          fi

      - name: Write .env (optional secret)
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "${ENV_FILE:-}" ]; then
            printf '%s\n' "$ENV_FILE" > .env
          fi
          # NOTE: never put GEMINI_API_KEY or other server secrets here —
          # anything in the web bundle is readable from the APK.

      - name: Build web bundle
        run: |
          # base ./ keeps asset URLs valid inside the Capacitor WebView (hash router)
          npx --no-install vite build --base=./
          test -f "${WEB_DIR}/index.html"

      # --------------------------------------------------------------- capacitor
      - name: Add Capacitor (CI-only, package.json in repo stays untouched)
        run: |
          if ! grep -q '"@capacitor/core"' package.json; then
            V="${CAPACITOR_VERSION}"
            bun add "@capacitor/core@${V}" "@capacitor/android@${V}" \
                    "@capacitor/app@${V}" "@capacitor/geolocation@${V}" \
                    "@capacitor/camera@${V}" "@capacitor/splash-screen@${V}"
            bun add -d "@capacitor/cli@${V}" "@capacitor/assets@latest"
          fi

      - name: Capacitor config
        run: |
          if ! ls capacitor.config.* >/dev/null 2>&1; then
            cat > capacitor.config.json <<EOF
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "${WEB_DIR}",
            "server": { "androidScheme": "https" },
            "android": { "allowMixedContent": false },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 800,
                "backgroundColor": "${BRAND_COLOR}",
                "showSpinner": false
              }
            }
          }
          EOF
          fi

      - name: Add Android platform
        run: |
          # If you later commit your own ./android folder, CI will use it as-is.
          [ -d android ] || npx --no-install cap add android

      # -------------------------------------------------------------------- icon
      - name: Generate app icon + splash (attendance pin with person and check)
        run: |
          mkdir -p assets
          if [ ! -f assets/icon-only.png ]; then
            read -r -d '' LOGO <<'EOS' || true
          <g>
            <path d="M512 800 C512 800 302 600 302 470 A210 210 0 1 1 722 470 C722 600 512 800 512 800 Z" fill="#FFFFFF"/>
            <circle cx="512" cy="420" r="62" fill="#006A4E"/>
            <path d="M392 575 C392 510 440 482 512 482 C584 482 632 510 632 575 Z" fill="#006A4E"/>
            <circle cx="705" cy="690" r="110" fill="#F42A41" stroke="#FFFFFF" stroke-width="14"/>
            <path d="M655 692 L691 728 L758 652" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
          EOS
            GRAD='<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00875F"/><stop offset="1" stop-color="#004D38"/></linearGradient></defs>'
            NS='xmlns="http://www.w3.org/2000/svg"'

            echo "<svg $NS viewBox=\"0 0 1024 1024\">$GRAD<rect width=\"1024\" height=\"1024\" fill=\"url(#g)\"/>$LOGO</svg>" > assets/icon-only.svg
            echo "<svg $NS viewBox=\"0 0 1024 1024\">$LOGO</svg>" > assets/icon-foreground.svg
            echo "<svg $NS viewBox=\"0 0 1024 1024\"><rect width=\"1024\" height=\"1024\" fill=\"${BRAND_COLOR}\"/></svg>" > assets/icon-background.svg
            echo "<svg $NS viewBox=\"0 0 2732 2732\"><rect width=\"2732\" height=\"2732\" fill=\"${BRAND_COLOR}\"/><g transform=\"translate(854 854)\">$LOGO</g></svg>" > assets/splash.svg

            for n in icon-only icon-foreground icon-background; do
              rsvg-convert -w 1024 -h 1024 "assets/$n.svg" -o "assets/$n.png"
            done
            rsvg-convert -w 2732 -h 2732 assets/splash.svg -o assets/splash.png
            cp assets/splash.png assets/splash-dark.png
            rm -f assets/*.svg
          fi

          npx --no-install capacitor-assets generate --android \
            --iconBackgroundColor "${BRAND_COLOR}" --iconBackgroundColorDark "${BRAND_COLOR}" \
            --splashBackgroundColor "${BRAND_COLOR}" --splashBackgroundColorDark "${BRAND_COLOR}"

      # ------------------------------------------- permissions + version patching
      - name: Patch AndroidManifest (camera + location) and version
        run: |
          python3 - <<'PY'
          import os, re, pathlib

          # ---- Manifest: camera & location, hardware optional so the app installs on any device
          mp = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = mp.read_text()
          wanted = [
            ('android.permission.INTERNET',             '<uses-permission android:name="android.permission.INTERNET" />'),
            ('android.permission.ACCESS_NETWORK_STATE', '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />'),
            ('android.permission.ACCESS_FINE_LOCATION', '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />'),
            ('android.permission.ACCESS_COARSE_LOCATION','<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'),
            ('android.permission.CAMERA',               '<uses-permission android:name="android.permission.CAMERA" />'),
            ('android.hardware.camera"',                '<uses-feature android:name="android.hardware.camera" android:required="false" />'),
            ('android.hardware.camera.front',           '<uses-feature android:name="android.hardware.camera.front" android:required="false" />'),
            ('android.hardware.location"',              '<uses-feature android:name="android.hardware.location" android:required="false" />'),
            ('android.hardware.location.gps',           '<uses-feature android:name="android.hardware.location.gps" android:required="false" />'),
          ]
          add = [line for key, line in wanted if key not in s]
          if add:
            s = s.replace('</manifest>', '    ' + '\n    '.join(add) + '\n</manifest>')
          # attendance data should not leak through adb/cloud backups
          s = s.replace('android:allowBackup="true"', 'android:allowBackup="false"')
          mp.write_text(s)

          # ---- Version from GitHub tag logic
          gp = pathlib.Path('android/app/build.gradle')
          t = gp.read_text()
          code, name = os.environ['VERSION_CODE'], os.environ['VERSION_NAME']
          t, n1 = re.subn(r'(versionCode\s*=?\s*)\d+', r'\g<1>' + code, t, count=1)
          t, n2 = re.subn(r'(versionName\s*=?\s*)"[^"]*"', r'\g<1>"' + name + '"', t, count=1)
          assert n1 and n2, 'versionCode/versionName not found in build.gradle'
          gp.write_text(t)
          PY

          # more Gradle memory for Capacitor 8 / SDK 36 builds
          printf '\norg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8\norg.gradle.daemon=false\n' >> android/gradle.properties

      - name: Sync web assets into Android project
        run: npx --no-install cap sync android

      # ------------------------------------------------------------------- build
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-cap${{ env.CAPACITOR_VERSION }}-${{ hashFiles('package.json') }}
          restore-keys: gradle-${{ runner.os }}-cap${{ env.CAPACITOR_VERSION }}-

      - name: Build APK
        env:
          HAVE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "$HAVE_KEYSTORE" = "true" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            echo "::warning::No keystore secrets found - building debug-signed APK (cannot update older installs)."
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Align + sign + rename APK
        env:
          HAVE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "BT=$BT" >> "$GITHUB_ENV"
          mkdir -p out

          if [ "$HAVE_KEYSTORE" = "true" ]; then
            SRC=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ems.jks"
            "$BT/zipalign" -p -f 4 "$SRC" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign \
              --ks "$RUNNER_TEMP/ems.jks" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
              --out "out/${APK_NAME}" "$RUNNER_TEMP/aligned.apk"
            rm -f "$RUNNER_TEMP/ems.jks"
          else
            SRC=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
            cp "$SRC" "out/${APK_NAME}"
          fi
          "$BT/apksigner" verify --print-certs "out/${APK_NAME}"

      - name: Verify APK (version + camera/location permissions)
        run: |
          set -euo pipefail
          APK="out/${APK_NAME}"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:"
          PERMS=$("$BT/aapt2" dump permissions "$APK")
          echo "$PERMS"
          for p in INTERNET CAMERA ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION; do
            echo "$PERMS" | grep -q "android.permission.$p" || { echo "::error::APK is missing $p"; exit 1; }
          done
          echo "$PERMS" | grep -q "RECORD_AUDIO" && echo "::warning::RECORD_AUDIO present (not needed for selfie attendance)" || true
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_PREFIX }}-v${{ env.VERSION_NAME }}
          path: out/*.apk
          retention-days: 30

      # ----------------------------------------------------------------- release
      - name: Publish GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
          HAVE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          set -euo pipefail
          FLAGS=()
          [ "$HAVE_KEYSTORE" = "true" ] || FLAGS+=(--prerelease)

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "out/${APK_NAME}" --clobber
          else
            gh release create "$TAG" "out/${APK_NAME}" \
              --target "$GITHUB_SHA" \
              --title "EMS ${TAG}" \
              --generate-notes "${FLAGS[@]}"
          fi

      - name: Summary
        run: |
          {
            echo "### EMS APK built"
            echo "- Version: **${VERSION_NAME}** (versionCode ${VERSION_CODE})"
            echo "- File: \`${APK_NAME}\`"
            echo "- Capacitor: ${CAPACITOR_VERSION}.x, Node ${NODE_VERSION}, JDK ${JAVA_VERSION}, SDK ${ANDROID_PLATFORM}"
          } >> "$GITHUB_STEP_SUMMARY"
